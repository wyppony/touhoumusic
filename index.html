<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方音乐播放器</title>
    <link rel="icon" href="9.ico" type="image/x-icon">  
    <link rel="icon" href="9-16x16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="9-32x32.png" type="image/png" sizes="32x32">
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: var(--bg-url, url('qln.jpg')) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #333;
            --theme-color: #ff88cc;
            transition: background 0.3s ease;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background: #fff;
        }
        .setting-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .setting-toggle-btn:hover {
            background: #fff;
        }
        .setting-modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
        }
        .setting-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            width: 320px;
            z-index: 1001;
            display: none;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #333;
        }
        .setting-title {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .theme-colors {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .theme-color {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .theme-color.active {
            border-color: #333;
        }
        .bg-upload {
            margin-top: 10px;
        }
        .bg-upload input {
            width: 100%;
            margin-top: 5px;
        }
        .player {
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 30px;
            margin-top: 80px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .player-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .player-header h1 {
            color: var(--theme-color);
            margin-bottom: 8px;
            font-size: 26px;
        }
        #search {
            width: 90%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid rgba(221,221,221,0.5);
            font-size: 16px;
            margin: 0 auto 20px;
            display: block;
            background: rgba(255,255,255,0.7);
            outline: none;
        }
        #search:focus {
            border-color: var(--theme-color);
        }
        .current-song {
            text-align: center;
            margin: 15px 0;
            font-size: 18px;
            color: #222;
        }
        /* 时间显示 */
        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #444;
            margin-top: 4px;
        }
        /* 双层进度条：缓冲 + 播放 */
        .progress-wrap {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(220,220,220,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .buffer-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #ddd;
            width: 0%;
            border-radius: 3px;
            z-index: 1;
        }
        #progress {
            position: absolute;
            left: 0;
            top: 0;
            -webkit-appearance: none;
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            z-index: 2;
            margin: 0;
            padding: 0;
        }
        #progress::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--theme-color);
            cursor: pointer;
            z-index: 3;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            align-items: center;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(221,221,221,0.5);
            background: rgba(255,255,255,0.6);
            color: #333;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.8);
        }
        .play-btn {
            width: 65px;
            height: 65px;
            background: var(--theme-color);
            color: #fff;
            border: none;
            font-size: 24px;
        }
        .switch-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            align-items: center;
        }
        .switch-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .switch-label {
            font-size: 14px;
            color: #333;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--theme-color);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .tab {
            padding: 8px 16px;
            background: rgba(245,245,245,0.5);
            border-radius: 6px;
            cursor: pointer;
            color: #333;
        }
        .tab.active {
            background: var(--theme-color);
            color: #fff;
        }
        .song-list {
            max-height: 420px;
            overflow-y: auto;
        }
        .song-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(238,238,238,0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .song-item:hover {
            background: rgba(255,255,255,0.2);
        }
        .song-item.active {
            background: rgba(255,136,204,0.15);
            border-left: 3px solid var(--theme-color);
        }
        .like-btn {
            font-size: 22px;
            cursor: pointer;
            color: #ccc;
        }
        .like-btn.liked {
            color: #ff3333;
        }
        .song-info small {
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>

<button class="back-btn" onclick="location.href='https://wyppony.github.io/lovebaka'">← 返回爱⑨之家</button>
<button class="setting-toggle-btn" id="settingToggle">⚙️ 播放器设置</button>

<div class="setting-modal-mask" id="settingMask"></div>
<div class="setting-modal" id="settingModal">
    <span class="modal-close" id="modalClose">×</span>
    <div class="setting-title">🎨 播放器设置</div>
    <div class="setting-title">主题颜色</div>
    <div class="theme-colors">
        <div class="theme-color active" style="background:#ff88cc" data-color="#ff88cc"></div>
        <div class="theme-color" style="background:#4096ff" data-color="#4096ff"></div>
        <div class="theme-color" style="background:#36c677" data-color="#36c677"></div>
        <div class="theme-color" style="background:#ff9500" data-color="#ff9500"></div>
    </div>

        <div class="setting-title">自定义背景图</div>

</div>

<div class="container">
    <div class="player">
        <div class="player-header">
            <h1>🎵 东方音乐播放器</h1>
            <p>Touhou Music Player</p>
        </div>

        <input type="text" id="search" placeholder="搜索歌曲、角色、作品">
        <div class="current-song" id="currentSong">未播放</div>

        <!-- 双层进度条 + 时间 -->
        <div class="progress-wrap">
            <div class="buffer-bar" id="bufferBar"></div>
            <input type="range" id="progress" min="0" max="100" value="0">
        </div>
        <div class="time-box">
            <span id="currentTime">00:00</span>
            <span id="durationTime">00:00</span>
        </div>

        <div class="controls">
            <button class="control-btn" id="prev">|◀</button>
            <button class="control-btn play-btn" id="play">▶</button>
            <button class="control-btn" id="next">▶|</button>
        </div>

        <div class="switch-group">
            <div class="switch-item">
                <span class="switch-label">单曲循环：<span id="loopText">关</span></span>
                <label class="switch">
                    <input type="checkbox" id="loopSwitch">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="switch-item">
                <span class="switch-label">随机播放：<span id="randomText">关</span></span>
                <label class="switch">
                    <input type="checkbox" id="randomSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-type="all">全部歌曲</div>
            <div class="tab" data-type="like">我的喜欢</div>
        </div>

        <div class="song-list" id="songList"></div>
    </div>
</div>

{name:"真夏的妖精梦",artist:"爱塔妮缇拉尔瓦",album:"东方天空璋"},
{name:"秘神摩多罗",artist:"EX面摩多罗隐岐奈",album:"东方天空璋"},

{name:"日渐荒废的工业遗址",artist:"虹龙洞四面",album:"东方虹龙洞"},
{name:"渴盼已久的逢魔之时",artist:"虹龙洞五面",album:"东方虹龙洞"},
{name:"熙攘市场今何在",artist:"天弓千亦",album:"东方虹龙洞"},
{name:"世界万物皆可爱",artist:"博丽灵梦",album:"东方兽王园"},
{name:"越轨者们的无碍光",artist:"日白残无",album:"东方兽王园"}
];

const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progress = document.getElementById('progress');
const currentSong = document.getElementById('currentSong');
const songList = document.getElementById('songList');
const search = document.getElementById('search');
const loopSwitch = document.getElementById('loopSwitch');
const randomSwitch = document.getElementById('randomSwitch');
const loopText = document.getElementById('loopText');
const randomText = document.getElementById('randomText');
const tabs = document.querySelectorAll('.tab');
const bgInput = document.getElementById('bgInput');
const themeColors = document.querySelectorAll('.theme-color');
const settingToggle = document.getElementById('settingToggle');
const settingModal = document.getElementById('settingModal');
const settingMask = document.getElementById('settingMask');
const modalClose = document.getElementById('modalClose');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const bufferBar = document.getElementById('bufferBar');

let current = 0;
let isPlay = false;
let isLoop = false;
let isRandom = false;
let likeList = JSON.parse(localStorage.getItem('touhouLike')) || [];

const localBg = localStorage.getItem('touhouBg');
if(localBg) document.body.style.setProperty('--bg-url', `url(${localBg})`);
const localTheme = localStorage.getItem('touhouTheme');
if(localTheme) {
    document.body.style.setProperty('--theme-color', localTheme);
    themeColors.forEach(c => c.classList.toggle('active', c.dataset.color === localTheme));
}

function timeFormat(s) {
    if(isNaN(s)) return "00:00";
    s = Math.floor(s);
    let m = Math.floor(s / 60);
    let sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function loadSong(index) {
    const song = songs[index];
    audio.src = song.name + '.mp3';
    currentSong.textContent = `${song.name} - ${song.artist}`;
    document.querySelectorAll('.song-item').forEach(i=>i.classList.remove('active'));
    const items = document.querySelectorAll('.song-item');
    items.forEach((item)=>{
        if(item.innerText.includes(song.name)) item.classList.add('active');
    });
}

function togglePlay() {
    if(isPlay) {
        audio.pause();
        playBtn.textContent = '▶';
    } else {
        audio.play();
        playBtn.textContent = '||';
    }
    isPlay = !isPlay;
}

function prevSong() {
    if(isRandom) current = Math.floor(Math.random()*songs.length);
    else current = current<=0 ? songs.length-1 : current-1;
    loadSong(current);
    if(isPlay) audio.play();
}

function nextSong() {
    if(isRandom) current = Math.floor(Math.random()*songs.length);
    else current = current>=songs.length-1 ? 0 : current+1;
    loadSong(current);
    if(isPlay) audio.play();
}

function renderList(filter='') {
    let list = [...songs];
    if(filter==='like') list = songs.filter(s=>likeList.includes(s.name));
    if(search.value) {
        const kw = search.value.toLowerCase();
        list = list.filter(s=>
            s.name.toLowerCase().includes(kw)||
            s.artist.toLowerCase().includes(kw)||
            s.album.toLowerCase().includes(kw)
        );
    }
    songList.innerHTML = '';
    list.forEach(song=>{
        const item = document.createElement('div');
        item.className = 'song-item';
        const liked = likeList.includes(song.name);
        item.innerHTML = `
            <div class="song-info">
                <div>${song.name}</div>
                <small>${song.artist}｜${song.album}</small>
            </div>
            <div class="like-btn ${liked?'liked':''}" onclick="toggleLike('${song.name}')">${liked?'❤️':'♡'}</div>
        `;
        item.onclick = (e)=>{
            if(e.target.classList.contains('like-btn')) return;
            current = songs.findIndex(s=>s.name===song.name);
            loadSong(current);
            audio.play();
            isPlay = true;
            playBtn.textContent = '||';
        };
        songList.appendChild(item);
    });
}

function toggleLike(name) {
    const i = likeList.indexOf(name);
    i>-1 ? likeList.splice(i,1) : likeList.push(name);
    localStorage.setItem('touhouLike',JSON.stringify(likeList));
    renderList(document.querySelector('.tab.active').dataset.type);
}
window.toggleLike = toggleLike;

// 播放进度
audio.ontimeupdate = ()=>{
    const percent = (audio.currentTime/audio.duration)*100 || 0;
    progress.value = percent;
    currentTimeEl.textContent = timeFormat(audio.currentTime);
};

// 总时长
audio.onloadedmetadata = ()=>{
    durationTimeEl.textContent = timeFormat(audio.duration);
};

// 缓冲进度
audio.onprogress = ()=>{
    if(audio.buffered.length>0) {
        const end = audio.buffered.end(audio.buffered.length-1);
        const percent = (end/audio.duration)*100 || 0;
        bufferBar.style.width = percent + '%';
    }
};

// 拖动进度
progress.oninput = ()=>{
    audio.currentTime = (progress.value/100)*audio.duration;
};

// 播放结束
audio.onended = ()=>{
    if(isLoop) {
        audio.currentTime = 0;
        audio.play();
    } else {
        nextSong();
    }
};

// 互斥开关
loopSwitch.onchange = ()=>{
    isLoop = loopSwitch.checked;
    if(isLoop) {
        isRandom = false;
        randomSwitch.checked = false;
        randomText.textContent = '关';
    }
    loopText.textContent = isLoop?'开':'关';
};
randomSwitch.onchange = ()=>{
    isRandom = randomSwitch.checked;
    if(isRandom) {
        isLoop = false;
        loopSwitch.checked = false;
        loopText.textContent = '关';
    }
    randomText.textContent = isRandom?'开':'关';
};

playBtn.onclick = togglePlay;
prevBtn.onclick = prevSong;
nextBtn.onclick = nextSong;

tabs.forEach(t=>{
    t.onclick = ()=>{
        tabs.forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        renderList(t.dataset.type);
    };
});

search.oninput = ()=>renderList(document.querySelector('.tab.active').dataset.type);

themeColors.forEach(c=>{
    c.onclick = ()=>{
        const color = c.dataset.color;
        document.body.style.setProperty('--theme-color',color);
        localStorage.setItem('touhouTheme',color);
        themeColors.forEach(x=>x.classList.remove('active'));
        c.classList.add('active');
    };
});

bgInput.onchange = (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = (ev)=>{
        const u = ev.target.result;
        document.body.style.setProperty('--bg-url',`url(${u})`);
        localStorage.setItem('touhouBg',u);
    };
    r.readAsDataURL(f);
};

settingToggle.onclick = ()=>{
    settingModal.style.display='block';
    settingMask.style.display='block';
};
modalClose.onclick = ()=>{
    settingModal.style.display='none';
    settingMask.style.display='none';
};
settingMask.onclick = ()=>{
    settingModal.style.display='none';
    settingMask.style.display='none';
};

loadSong(0);
renderList();
</script>
</body>
</html>
